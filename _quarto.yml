project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
  resources:
    - "phd/data/*.csv"
    - "assets/*.js"

website:
  title: "STAT_DEMS"
  description: "Statistica al DEMS, Università degli Studi di Milano-Bicocca"
  site-url: https://stat-dems-unimib.github.io
  favicon: img/logo-stat-dems.jpg
  page-navigation: false
  bread-crumbs: false
  search:
    location: navbar
    type: overlay
  navbar:
    logo: img/logo-stat-dems.jpg
    logo-alt: "STAT_DEMS UNIMIB"
    title: "STAT_DEMS"
    left:
      - text: "CLAMSES"
        menu:
          - text: "CLAMSES Home"
            href: master/index.qmd
          - text: "Giovani Talenti"
            href: master/giovani-talenti/index.qmd
      - text: "PhD"
        menu:
          - text: "PhD Home"
            href: phd/index.qmd
          - text: "Faculty"
            href: phd/faculty.qmd
          - text: "PhD alumni"
            href: phd/alumni.qmd
          - text: "Current PhD students"
            href: phd/students.qmd
          - text: "PhD Seminar Series"
            href: phd/phd-seminars.qmd
      - text: "Statistics Seminars"
        href: phd/seminars.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/company/statistica-dems-universit%C3%A0-milano-bicocca/
        aria-label: "LinkedIn"
  # One navbar for the whole site: one entry per section (bachelor/, master/, phd/);
  # a section with several pages gets a dropdown menu. A folder can set its own
  # look in _metadata.yml, but not its own navbar (Quarto does not allow it).
  page-footer:
    left: "DEMS · Università degli Studi di Milano-Bicocca"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/company/statistica-dems-universit%C3%A0-milano-bicocca/
        aria-label: "LinkedIn"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-title: " "
    page-layout: article
    lang: it
